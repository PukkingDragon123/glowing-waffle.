<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bengrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Caveat:wght@600;700&display=swap">
<style>
:root {
  --bg: #000;
  --ink: #f4f1ea;
  --shadow: #000;
  --osd: #e8f0ff;
  --blood: #9b0d0d;
  --panel: rgba(8, 8, 10, 0.86);
  --line: rgba(255, 255, 255, 0.18);
  --accent: #c8c0a8;
  --osd-font: 'Special Elite', 'Courier New', Courier, monospace;
  --sub-font: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  --type-font: 'Special Elite', 'Courier New', Courier, monospace;
  --hand-font: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { color: var(--ink); font-family: var(--sub-font); user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; cursor: none; background: #000; image-rendering: pixelated; }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#osd { display: none !important; position: absolute; top: max(18px, env(safe-area-inset-top, 0px)); left: max(26px, env(safe-area-inset-left, 0px)); right: max(26px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; font-family: var(--osd-font); font-size: clamp(18px, 2.6vw, 30px); color: var(--osd); text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7); letter-spacing: 1px; opacity: 0.85; }
#osd .r { text-align: right; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 2px #000; transition: transform 0.12s, background 0.12s; }
#crosshair.hot { transform: scale(2.2); background: rgba(255, 255, 255, 0.9); }
#crosshair.hidden { opacity: 0; }
#prompt { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); display: flex; gap: 6px; font-family: var(--type-font); font-size: clamp(11px, 1vw, 14px); letter-spacing: 0.5px; color: var(--ink); text-shadow: 0 0 3px #000, 1px 1px 0 #000, -1px -1px 0 #000; white-space: nowrap; text-align: center; opacity: 0; transition: opacity 0.15s; }
#prompt.on { opacity: 0.92; }
#prompt .key { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50%; background: rgba(0, 0, 0, 0.35); color: rgba(255, 255, 255, 0.85); }
#prompt .row { display: block; margin-top: 3px; }
#subs { position: absolute; left: 50%; bottom: max(9vh, calc(env(safe-area-inset-bottom, 0px) + 40px)); transform: translateX(-50%); width: min(92vw, 1100px); text-align: center; }
#subs .line { display: block; font-family: var(--sub-font); font-size: clamp(15px, 1.75vw, 25px); font-weight: 400; color: #f2eee6; line-height: 1.45; margin-top: 0.25em; text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 1px 2px #000, 1px 0 2px #000, -1px 0 2px #000; opacity: 0; transition: opacity 0.6s; text-wrap: balance; }
#subs .line.on { opacity: 1; }
#subs .who { display: block; font-size: 0.68em; letter-spacing: 1px; margin-bottom: 0.1em; }
#subs .line.inner { font-style: italic; color: #ece7dc; }
#subs .line.voice { color: #d9f0ff; }
#subs .line.strange { color: #ffd0d0; letter-spacing: 2px; }
#choices { position: absolute; left: 50%; bottom: 26vh; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#choices .c { font-family: var(--type-font); font-size: clamp(15px, 1.7vw, 24px); letter-spacing: 1px; padding: 4px 16px; color: #ddd; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; border-left: 3px solid transparent; }
#choices .c.sel { color: #fff; border-left-color: #fff; background: linear-gradient(90deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0)); }
#inv { position: absolute; right: max(26px, env(safe-area-inset-right, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; opacity: 0; transition: opacity 0.4s; }
#inv.on { opacity: 0.9; }
#inv .slot { width: 34px; height: 34px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; font-family: var(--type-font); font-size: 13px; color: #ddd; position: relative; }
#inv .slot.full::after { content: ''; position: absolute; width: 10px; height: 10px; right: 5px; bottom: 5px; background: rgba(255, 255, 255, 0.75); }
#inv .slot .k { opacity: 0.55; }
#inv .slot .n { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#inv .slot.hand { border-color: rgba(255, 255, 255, 0.55); }
#note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(560px, 86vw); padding: 28px 32px; background: #efe6c8; color: #2a2418; font-family: var(--hand-font); font-size: clamp(20px, 2.2vw, 28px); line-height: 1.5; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); white-space: pre-wrap; display: none; transform-origin: center; }
#note.on { display: block; }
#note .hint { display: none; }
#title-card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--osd-font); color: #fff; opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 8px rgba(255, 255, 255, 0.35); }
#title-card.on { opacity: 1; }
#title-card .big { font-family: var(--sub-font); font-style: italic; font-size: clamp(40px, 7vw, 96px); letter-spacing: 6px; }
#title-card .small { font-size: clamp(18px, 2.4vw, 32px); letter-spacing: 4px; opacity: 0.8; }

#pause { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.72); display: flex; align-items: center; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#pause .pause-inner { display: flex; flex-direction: column; gap: 10px; min-width: min(360px, 90vw); font-family: var(--osd-font); }
#pause .pause-title { font-family: var(--sub-font); font-style: italic; font-size: 46px; letter-spacing: 4px; color: #fff; margin-bottom: 14px; }
#pause button { font-family: var(--type-font); font-size: 22px; letter-spacing: 3px; text-align: left; background: transparent; color: #cfcfcf; border: 0; border-left: 3px solid transparent; padding: 4px 14px; cursor: pointer; }
#pause button:hover, #pause button:focus-visible { color: #fff; border-left-color: #fff; outline: none; background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), transparent); }
#pause-panel { margin-top: 12px; font-family: var(--type-font); font-size: 16px; color: #ddd; }
#pause-panel .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 3px 0; }
#pause-panel .row .val { display: flex; align-items: center; gap: 8px; }
#pause-panel .row button { font-size: 18px; padding: 0 10px; }
#pause-panel .ctl { display: grid; grid-template-columns: 9em 1fr; gap: 2px 18px; font-size: 15px; }
#pause-panel .ctl b { color: #fff; font-weight: 400; }

/* loading: black, the cat running, three dots */
#boot { position: fixed; inset: 0; z-index: 30; background: transparent; pointer-events: none; transition: opacity 1.2s; }
#boot.out { opacity: 0; }
#boot .dots { position: absolute; left: 50%; bottom: calc(18vh + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 14px; transition: opacity 0.8s; }
#boot .dots i { width: 7px; height: 7px; border-radius: 50%; background: #e8e4dc; opacity: 0.2; animation: dot 1.4s infinite ease-in-out; }
#boot .dots i:nth-child(2) { animation-delay: 0.2s; }
#boot .dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%, 100% { opacity: 0.15; transform: translateY(0); } 40% { opacity: 0.95; transform: translateY(-4px); } }
#boot.ready .dots { opacity: 0; }
#boot .hint { position: absolute; left: 50%; bottom: calc(18vh + env(safe-area-inset-bottom, 0px) - 6px); transform: translateX(-50%); font-family: var(--type-font); font-size: 15px; letter-spacing: 6px; color: #e8e4dc; opacity: 0; transition: opacity 1.2s; text-transform: lowercase; }
#boot.ready .hint { opacity: 0.7; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.3; } }
#boot .warn { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; font-family: var(--type-font); font-size: 11px; letter-spacing: 1px; color: #6a6660; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: reduce) { #boot .dots i, #boot.ready .hint { animation: none; } }

#obj { position: absolute; top: max(26px, calc(env(safe-area-inset-top, 0px) + 18px)); left: max(28px, env(safe-area-inset-left, 0px)); font-family: var(--type-font); font-size: clamp(12px, 1.15vw, 16px); color: #e8e4dc; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 0 0 4px #000; line-height: 1.6; opacity: 0; transition: opacity 0.8s; max-width: 46vw; }
#obj.on { opacity: 0.9; }
#obj .o { display: block; }
#obj .o::before { content: '\25A1  '; opacity: 0.7; }
#obj .o.done { opacity: 0.45; text-decoration: line-through; }
#obj .o.done::before { content: '\25A0  '; }

</style>
</head>
