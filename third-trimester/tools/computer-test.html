<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doorways 98 test bench</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/computer.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
  #wrap { position: absolute; inset: 0 0 34px 0; }
  #pc { position: absolute; left: 0; top: 0; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #222; color: #ccc; font-size: 12px; }
  #bar button { font-size: 12px; }
  #crt { position: absolute; right: 8px; bottom: 40px; width: 256px; height: 192px; border: 2px solid #444; display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="pc"></div></div>
<canvas id="crt" width="256" height="192"></canvas>
<div id="bar">
  Day <select id="day"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
  <button id="born">baby born</button>
  <button id="clock">+60 min</button>
  <button id="toggle">close/open</button>
  <button id="crtbtn">show CRT texture</button>
  <span id="info"></span>
</div>
<script type="module">
import { game } from '../src/core/game.js';
import { AudioEngine } from '../src/core/audio.js';
import { newState } from '../src/game/state.js';
import { createComputer } from '../src/computer/index.js';

game.state = newState();
game.state.clock = 9 * 60 + 5;
game.audio = new AudioEngine();
game.audio.loadSamples('../assets/sfx');
const root = document.getElementById('pc');
const pc = createComputer({ root, game });
game.computer = pc;
window.pc = pc; window.game = game;
const fit = () => {
  const wrap = document.getElementById('wrap'); const s = Math.min(wrap.clientWidth / 800, wrap.clientHeight / 600);
  root.style.transform = `translate(${(wrap.clientWidth - 800 * s) / 2}px, ${(wrap.clientHeight - 600 * s) / 2}px) scale(${s})`;
};
addEventListener('resize', fit); fit();
const log = (n) => game.events.on(n, (d) => { console.log('[event]', n, JSON.stringify(d || {})); });
['computer:exit', 'phone:ring', 'phone:stop', 'call:start', 'call:end', 'shift:in', 'shift:out', 'purchase', 'sell', 'finale:start', 'wall:knock', 'money'].forEach(log);
game.events.on('wall:knock', ({ count }) => { for (let i = 0; i < count; i++) setTimeout(() => game.audio.sfx('knock', { vol: 0.5 }), i * 450); });
let ringLoop = null;
game.events.on('phone:ring', () => { ringLoop = setInterval(() => game.audio.sfx('phone_ring', { vol: 0.35 }), 2600); game.audio.sfx('phone_ring', { vol: 0.35 }); });
game.events.on('phone:stop', () => clearInterval(ringLoop));
game.events.on('computer:exit', () => { pc.close(); setTimeout(() => pc.open(), 1500); });
pc.open();
let last = performance.now();
const crt = document.getElementById('crt'), cx = crt.getContext('2d');
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  game.state.clock += dt * (window.FAST ? 30 : 1 / 2);
  pc.update(dt);
  if (crt.style.display === 'block') pc.drawScreen(cx, 256, 192);
  document.getElementById('info').textContent = `clock ${Math.floor(game.state.clock / 60)}:${String(Math.floor(game.state.clock % 60)).padStart(2, '0')}  $${game.state.money.toFixed(2)}`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('day').onchange = (e) => { game.state.day = +e.target.value; game.state.clock = 9 * 60 + 5; game.events.emit('day:start', { day: game.state.day }); };
document.getElementById('born').onclick = () => { game.state.baby.born = true; game.events.emit('baby:born', {}); };
document.getElementById('clock').onclick = () => { game.state.clock += 60; };
document.getElementById('toggle').onclick = () => (pc.isOpen ? pc.close() : pc.open());
document.getElementById('crtbtn').onclick = () => { crt.style.display = crt.style.display === 'block' ? 'none' : 'block'; };
</script>
</body>
</html>
