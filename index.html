<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ต้มยำกุ้ง ๒๕๔๐ · Tom Yum 2540</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,600;0,800;1,300;1,400&family=Sarabun:wght@400;700&family=Itim&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/",
  "cannon-es": "./vendor/cannon-es.js"
} }
</script>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hud">
  <div id="osd"></div>
  <div id="ticker"><div class="date"></div><div class="fx"><span class="cur">US$1</span> = <b class="rate">24.50</b> ฿ <span class="arrow"></span></div></div>
  <div id="obj"></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="subs"></div>
  <div id="choices"></div>
  <div id="inv"><div class="slot" data-i="0"><span class="k">1</span><span class="n"></span></div><div class="slot" data-i="1"><span class="k">2</span><span class="n"></span></div></div>
  <div id="note"></div>
  <div id="title-card"></div>
</div>
<div id="pause" hidden>
  <div class="pause-inner">
    <div class="pause-title">พัก <small>pause</small></div>
    <button data-act="resume" id="p-resume">เล่นต่อ · RESUME</button>
    <button data-act="settings" id="p-settings">ตั้งค่า · SETTINGS</button>
    <button data-act="controls" id="p-controls">ปุ่มควบคุม · CONTROLS</button>
    <button data-act="menu" id="p-menu">ออกไปเมนู · QUIT TO MENU</button>
    <div id="pause-panel"></div>
  </div>
</div>
<div id="boot">
  <div class="dots" aria-label="loading"><i></i><i></i><i></i></div>
  <div class="hint" id="boot-hint">คลิก · click</div>
  <div class="title-th">ต้มยำกุ้ง ๒๕๔๐</div>
  <div class="warn">ใส่หูฟัง · headphones · body horror, blood, drugs, flashing lights · political satire, a work of fiction · keyboard and mouse</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
